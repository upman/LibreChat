name: Sync upstream to main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for new commits
        id: check
        run: |
          git fetch origin upstream-dev
          COUNT=$(git rev-list --count main..origin/upstream-dev)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "main is already up to date with upstream-dev."
          fi

      - name: Create merge branch and PR
        if: steps.check.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d-%H%M%S)"
          DATE="$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"

          # Attempt the merge with --no-commit so we can detect conflicts
          # without committing markers to git history. On conflict, abort and
          # push the branch at pre-merge state (= main); the PR description
          # includes a recipe for the human to do the merge locally and push,
          # which lands as a single clean merge commit on the branch.
          HAS_CONFLICTS=0
          if ! git merge origin/upstream-dev --no-ff --no-commit -m "chore: merge upstream $DATE"; then
            HAS_CONFLICTS=1
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort
          else
            git commit --no-edit
          fi

          git push origin "$BRANCH"

          if [ "$HAS_CONFLICTS" -eq 0 ]; then
            TITLE="chore: sync upstream $DATE"
            BODY="$(cat <<'EOF'
          ## Upstream sync

          This PR merges the latest changes from `upstream-dev` into `main`.

          **Merge status:** Clean — no conflicts detected.
          EOF
          )"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          else
            TITLE="chore: sync upstream $DATE [CONFLICTS — manual merge required]"
            BODY="$(cat <<EOF
          ## Upstream sync — :warning: CONFLICTS

          This PR is a placeholder. The merge of \`upstream-dev\` into \`main\` has unresolved conflicts and must be performed locally — the workflow does NOT commit conflict markers to git history.

          The PR branch (\`$BRANCH\`) currently points at \`main\` (no merge yet). Do the merge locally and push; the PR will then contain a single clean merge commit.

          ### Files that will conflict
          \`\`\`
          $CONFLICTS
          \`\`\`

          ### How to resolve
          \`\`\`bash
          git fetch origin
          git checkout $BRANCH
          git merge origin/upstream-dev
          # resolve markers in the listed files
          git add -u
          git commit            # default merge commit message is fine
          git push              # fast-forward, no force needed
          \`\`\`

          Confirm CI (ESLint, Vite build) passes before marking ready for review.
          EOF
          )"
            gh label create has-conflicts --color B60205 --description "Sync PR with unresolved merge conflicts" --force >/dev/null 2>&1 || true
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY" \
              --draft \
              --label has-conflicts
          fi
