name: Sync upstream to main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for new commits
        id: check
        run: |
          git fetch origin upstream-dev
          COUNT=$(git rev-list --count main..origin/upstream-dev)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "main is already up to date with upstream-dev."
          fi

      - name: Create merge branch and PR
        if: steps.check.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-$(date +%Y%m%d-%H%M%S)"
          DATE="$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"

          # Attempt the merge. On conflict, commit the markers as-is so the
          # PR is visible; open it as a draft with a `has-conflicts` label so
          # the state is impossible to miss.
          HAS_CONFLICTS=0
          if ! git merge origin/upstream-dev --no-ff -m "chore: merge upstream $DATE"; then
            HAS_CONFLICTS=1
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git add -A
            git commit --no-edit -m "chore: merge upstream $DATE (conflicts)"
          fi

          git push origin "$BRANCH"

          if [ "$HAS_CONFLICTS" -eq 0 ]; then
            TITLE="chore: sync upstream $DATE"
            BODY="$(cat <<'EOF'
          ## Upstream sync

          This PR merges the latest changes from `upstream-dev` into `main`.

          **Merge status:** Clean — no conflicts detected.
          EOF
          )"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          else
            TITLE="chore: sync upstream $DATE [CONFLICTS — resolve before merge]"
            BODY="$(cat <<EOF
          ## Upstream sync — :warning: CONFLICTS

          This PR merges the latest changes from \`upstream-dev\` into \`main\`.

          > [!WARNING]
          > The merge commit contains **unresolved conflict markers**. GitHub reports the PR as mergeable because the markers have been committed, so this must be resolved manually before merging.

          ### Files needing resolution
          \`\`\`
          $CONFLICTS
          \`\`\`

          ### How to resolve
          \`\`\`bash
          git fetch origin $BRANCH
          git checkout $BRANCH
          # edit each file above, remove <<<<<<< / ======= / >>>>>>> markers
          git add <files>
          git commit -m "fix: resolve merge conflicts"
          git push
          \`\`\`

          Confirm CI (ESLint, Vite build) passes before marking ready for review.
          EOF
          )"
            gh label create has-conflicts --color B60205 --description "Sync PR with unresolved merge conflicts" --force >/dev/null 2>&1 || true
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY" \
              --draft \
              --label has-conflicts
          fi
