name: Sync upstream-dev

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream-dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/danny-avila/LibreChat.git
          git fetch upstream dev

          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/dev)

          if [ "$LOCAL_SHA" = "$UPSTREAM_SHA" ]; then
            echo "upstream-dev is already up to date."
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list --count HEAD..upstream/dev)
          echo "Syncing $COMMIT_COUNT new commit(s) from upstream/dev"

          git reset --hard upstream/dev
          git push origin upstream-dev --force
