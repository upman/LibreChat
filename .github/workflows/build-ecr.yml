name: Build and Push to ECR

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions: write-all

concurrency:
  group: build-ecr-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  COMPONENT_NAME: 'aiml-librechat-private'
  ECR_REPO: 'aiml-librechat'

jobs:
  build-docker:
    runs-on: [dataplane, self-hosted, linux, x64, large]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${REF_NAME}"
          else
            RAW_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          fi
          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=librechat-private-${VERSION}" >> $GITHUB_OUTPUT

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build
        with:
          version: ${{ steps.version.outputs.version }}
          image_tag: ${{ steps.version.outputs.image_tag }}
          aws_role_arn: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          context: .
          file: Dockerfile
          target: node
          ecr_repo: ${{ env.ECR_REPO }}
