name: Docker Build and Push
description: Build and push a Docker image to ECR

inputs:
  version:
    required: true
    description: Numeric version (e.g., 1.0.0) used as the app_version build-arg
  image_tag:
    required: true
    description: Docker image tag (e.g., librechat-private-1.0.0)
  aws_role_arn:
    required: true
    description: AWS IAM role ARN for ECR access
  context:
    required: true
    description: Docker build context path (e.g., .)
  file:
    required: true
    description: Dockerfile path (e.g., Dockerfile)
  target:
    required: false
    default: ""
    description: Docker build target for multi-stage builds (e.g., node)
  ecr_repo:
    required: true
    description: ECR repository name (e.g., aiml-librechat)

outputs:
  version:
    description: The version used for tagging
    value: ${{ inputs.version }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        role-session-name: aws-aiml-build-docker-${{ inputs.ecr_repo }}
        aws-region: us-west-2

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr
      with:
        mask-password: 'true'

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        build-args: |
          app_version=${{ inputs.version }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        provenance: false
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repo }}:${{ inputs.image_tag }}
